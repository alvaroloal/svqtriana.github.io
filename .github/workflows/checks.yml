name: checks

# Cada comprobación existe por una regresión real del sitio anterior: títulos
# duplicados, canonical con .html, navegación inyectada por JS, ads.txt con
# mayúsculas, versión que no coincide con el CHANGELOG, scripts inline
# bloqueados por la CSP o assets referenciados que no existen.

# DESACTIVADO de momento: solo se ejecuta a mano (Actions -> checks -> Run
# workflow). Para reactivarlo en cada PR y push a main, devuelve el bloque:
#   on:
#     pull_request:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:dist

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Accesibilidad, menú móvil, mapa y rutas
        run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:lighthouse

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      # Sin backend ni credenciales: validate comprueba la configuración, no
      # habla con Cloudflare. El apply sigue siendo un acto humano.
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
